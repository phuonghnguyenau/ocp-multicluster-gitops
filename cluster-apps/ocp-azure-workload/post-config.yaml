apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: appset-ocp-azure-workload-post-config
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - list:
      elements:
      - name: gitops-operator
      - name: cluster-config
      - name: auth
      - name: logging-operator
      - name: oadp-operator
      - name: compliance-operator
      - name: cluster-observability-operator
  template:
    metadata:
      name: '{{.name}}'
      labels:
        apptype: post-config
    spec:
      project: "default"
      source:
        repoURL: https://github.com/phuonghnguyenau/ocp-multicluster-gitops.git
        targetRevision: refs/heads/main
        path: 'post-config/{{.name}}/overlays/ocp-azure-workload/'
      destination:
        server: https://kubernetes.default.svc
      syncPolicy:
        automated: {}
        syncOptions:
        - CreateNamespace=true
        - ApplyOutOfSyncOnly=true
        retry:
          refresh: true
