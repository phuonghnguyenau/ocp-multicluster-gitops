apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - etcd-encryption.yaml
  - banner.yaml
  - disable-self-provisioners.yaml

patches:
  - target:
      group: operator.openshift.io
      version: v1
      kind: Console
      name: cluster
    patch: |-
      - op: add
        path: /spec/plugins/-
        value: gitops-plugin
