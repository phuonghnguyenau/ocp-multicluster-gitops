apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - path: banner-patch.yaml
    target:
      kind: ConsoleNotification
      name: console-banner
  - path: console-plugins-patch.yaml
    target:
      group: operator.openshift.io
      version: v1
      kind: Console
      name: cluster
